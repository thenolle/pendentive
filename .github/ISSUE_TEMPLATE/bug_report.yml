name: Bug report
description: Something in Socle isn't working as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much detail as you can -- Socle has zero dependencies, so most bugs are reproducible with a tiny standalone snippet.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short code snippet (or link to a CodePen/StackBlitz) that reproduces the issue.
      render: ts
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: socle-version
    attributes:
      label: Socle version
      placeholder: e.g. 0.1.1
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - Browser (script tag / dist/socle.global.js)
        - Node.js
        - Bun
        - Bundler (esbuild/vite/webpack/etc.)
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime / browser version
      placeholder: e.g. Chrome 128, Node 20.11, Bun 1.1.20
    validations:
      required: false